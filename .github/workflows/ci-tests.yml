name: CI Tests

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main, dev ]

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Run Gateway Service Tests
        working-directory: ./coduelle-gateway
        run: |
          chmod +x gradlew
          ./gradlew test

      - name: Run Judge Worker Tests
        working-directory: ./coduelle-judge-worker
        run: |
          chmod +x gradlew
          ./gradlew test
